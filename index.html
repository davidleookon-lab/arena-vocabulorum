<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a3241c">
<title>Arena Vocabulorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f6f2ea;--card:#fffdf9;--ink:#1f1b16;--muted:#8a8174;--line:#e7e0d3;--soft:#f1ebdf;
  --accent:#a3241c;--accent-ink:#fff;--accent-soft:#f5e6e3;--gold:#b0883a;
  --good:#3d7a49;--good-soft:#e6f1e7;--bad:#b3261e;--bad-soft:#f8e5e2;
  --shadow:0 1px 2px rgba(40,30,20,.04),0 8px 24px rgba(40,30,20,.06);
  --r:16px;
}
[data-theme=dark]{
  --bg:#13110f;--card:#1c1916;--ink:#efe8dc;--muted:#958b7d;--line:#2d2924;--soft:#24201c;
  --accent:#d9483b;--accent-ink:#fff;--accent-soft:#3a1f1b;--gold:#d2a75a;
  --good:#6db37a;--good-soft:#1d2c20;--bad:#e5655a;--bad-soft:#3a1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:16px;color:var(--ink);line-height:1.45;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lat{font-family:'EB Garamond',Georgia,serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 18px 110px}
.hidden{display:none!important}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-family:'Cinzel',serif;font-weight:700;letter-spacing:2.5px;font-size:14px;color:var(--accent);white-space:nowrap}
.brand small{display:block;font-family:'Inter';letter-spacing:0;font-weight:500;color:var(--muted);font-size:11px;margin-top:1px}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.pill svg{width:17px;height:17px}
.pill.flame{color:var(--accent)}
.pill .rn{font-family:'Cinzel',serif}
.ptitle{font-family:'Cinzel',serif;font-size:30px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.psub{font-family:'EB Garamond',serif;font-style:italic;color:var(--muted);font-size:18px;margin:2px 0 20px}
.label{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}

/* Karten & Listen */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;transition:background .15s}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.item .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-weight:600;font-size:16px}
.item .s{font-size:13.5px;color:var(--muted)}
.item .s i{font-family:'EB Garamond',serif;font-size:15px}
.item .chev{color:var(--muted);width:18px;height:18px}
.muted{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}

/* Heute-Karte */
.today{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:84px;height:84px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .in b{font-size:22px;font-weight:700}
.ring .in span{font-size:11px;color:var(--muted)}
.today .tx{flex:1;min-width:0}
.today h3{font-size:18px;font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.gold>div{background:var(--gold)}
.bar.good>div{background:var(--good)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15.5px;cursor:pointer;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.center{justify-content:center;text-align:center}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
select,textarea,input[type=text]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;width:100%;outline:none;transition:border-color .15s}
select{width:auto;padding:9px 12px;font-size:14px}
select:focus,textarea:focus,input[type=text]:focus{border-color:var(--accent)}
textarea{min-height:200px;resize:vertical;line-height:1.55;font-size:15px}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:7px 0;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent)}

/* Spiel-Ansicht */
.game-top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.x{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.x:hover{background:var(--soft)}
.game-top .bar{flex:1;height:8px}
.game-top .cnt{font-weight:600;font-size:14px;color:var(--muted);min-width:44px;text-align:right}
.prompt{text-align:center;margin:10px 0 28px}
.prompt .w{font-family:'EB Garamond',serif;font-size:42px;font-weight:600;line-height:1.15}
.prompt .h{color:var(--muted);font-size:15px;margin-top:6px}
.prompt .t{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px}
.answers{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-size:16.5px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;box-shadow:0 2px 0 var(--line)}
.ans:hover{border-color:var(--muted)}
.ans:active{transform:translateY(1px)}
.ans .k{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex-shrink:0}
.ans.right{border-color:var(--good);background:var(--good-soft);color:var(--good);box-shadow:0 2px 0 var(--good)}
.ans.right .k{border-color:var(--good);color:var(--good)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.ans.dim{opacity:.45}
.typein{font-family:'EB Garamond',serif;font-size:24px;text-align:center;padding:16px}
.typein.ok{border-color:var(--good);background:var(--good-soft)}
.typein.err{border-color:var(--bad);background:var(--bad-soft)}
.fb{min-height:52px;margin:14px 0;padding:12px 14px;border-radius:12px;font-weight:500;display:flex;gap:10px;align-items:center;opacity:0;transition:opacity .2s}
.fb.show{opacity:1}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.err{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--soft);color:var(--muted)}
.fb b{font-weight:700}
.combo{text-align:center;height:22px;font-weight:700;color:var(--gold);font-size:15px;letter-spacing:.5px}
.timer{height:4px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:18px}
.timer>div{height:100%;background:var(--gold);width:100%}

/* Karteikarte */
.flip{perspective:1400px;height:300px;cursor:pointer;margin-bottom:22px;user-select:none}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip.sr .flip-in{transform:translateX(120%) rotate(12deg);opacity:0;transition:.3s}
.flip.sl .flip-in{transform:translateX(-120%) rotate(-12deg);opacity:0;transition:.3s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.face.b{transform:rotateY(180deg);background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.face .w{font-family:'EB Garamond',serif;font-size:38px;font-weight:600;line-height:1.2}
.face .meta{position:absolute;bottom:16px;left:0;right:0;font-size:13px;color:var(--muted)}
.face.b .meta{color:rgba(255,255,255,.7)}
.boxes{position:absolute;top:18px;left:20px;display:flex;gap:4px}
.boxes i{width:16px;height:4px;border-radius:9px;background:var(--line)}
.boxes i.on{background:var(--gold)}
.speak{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.speak svg{width:20px;height:20px}

/* Boss */
.arena{text-align:center;padding:8px 0 4px}
.medal{position:relative;width:128px;height:128px;margin:8px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 75%,#fff),var(--accent) 70%);color:#fff;font-family:'Cinzel',serif;font-size:56px;font-weight:700;
  box-shadow:0 0 0 6px var(--card),0 0 0 7px var(--line),0 14px 30px color-mix(in srgb,var(--accent) 35%,transparent);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.medal.hit{animation:hit .3s}
@keyframes hit{40%{transform:scale(.9) rotate(-6deg);filter:brightness(1.6)}}
.medal.atk{animation:atk .4s}
@keyframes atk{50%{transform:scale(1.18) translateY(18px)}}
.medal.dead{animation:dead .8s forwards}
@keyframes dead{to{transform:scale(.2) rotate(200deg);opacity:0}}
.bname{font-family:'Cinzel',serif;font-weight:700;font-size:20px}
.blvl{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:600}
.hp{height:10px;max-width:300px;margin:10px auto 6px;border-radius:99px;background:var(--soft);overflow:hidden}
.hp>div{height:100%;background:var(--accent);transition:width .4s cubic-bezier(.2,.9,.3,1.3)}
.lives{display:flex;gap:4px;color:var(--accent)}
.lives svg{width:20px;height:20px}
.lives svg.off{color:var(--line)}
.dmg{position:absolute;left:50%;top:38%;font-family:'Cinzel',serif;font-weight:700;font-size:28px;color:var(--accent);pointer-events:none;animation:dmg .9s forwards}
.dmg.crit{color:var(--gold);font-size:34px}
@keyframes dmg{to{transform:translate(var(--dx,0),-70px);opacity:0}}

/* Ergebnis */
.result{text-align:center;padding-top:20px}
.result .big{font-family:'Cinzel',serif;font-size:64px;font-weight:700;color:var(--accent);line-height:1}
.result h2{font-family:'Cinzel',serif;font-size:22px;margin:12px 0 4px}
.xpgain{display:inline-block;margin:16px 0;padding:8px 16px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.sq{display:flex;gap:4px;justify-content:center;margin:12px 0}
.sq i{width:16px;height:16px;border-radius:4px;background:var(--good)}
.sq i.x{background:var(--bad)}
.missed{text-align:left;margin:18px 0}
.missed div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.missed div span:first-child{font-family:'EB Garamond',serif;font-size:17px;font-weight:600}

/* Lektionen */
.lesson{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.chk svg{width:15px;height:15px;stroke-width:2.5}
.chk.on{background:var(--accent);border-color:var(--accent)}
.lesson .tx{flex:1;min-width:0}
.lesson b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .bar{margin-top:7px;height:4px}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:19px;height:19px}
.ib.warn{background:var(--bad);color:#fff;width:auto;padding:0 10px;font-size:13px;font-weight:600}
.code{font-family:ui-monospace,monospace;font-size:12.5px;min-height:120px;word-break:break-all}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Grammatik-Tabellen */
.gt{width:100%;border-collapse:collapse}
.gt th{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 6px;text-align:left}
.gt td{padding:5px 6px;vertical-align:top}
.gt td:first-child{color:var(--muted);font-size:14px;white-space:nowrap;width:1%;padding-top:16px}
.gt input{font-family:'EB Garamond',serif;font-size:19px;padding:10px 12px}
.gt input.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.gt input.err{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.gt .sol{display:block;font-size:13px;color:var(--good);margin:3px 2px 0;font-weight:600}
.ref td,.ref th{white-space:nowrap;border-bottom:1px solid var(--line)}
.ref td{font-family:'EB Garamond',serif;font-size:17px;padding:8px 10px 8px 6px}
.ref td:first-child{font-family:'Inter';padding-top:9px}
.ref .e{color:var(--accent);font-weight:600}
.scroll{overflow-x:auto;margin:0 -4px}
.whead{text-align:center;margin-bottom:12px}
.whead .w{font-family:'EB Garamond',serif;font-size:28px;font-weight:600}
.whead .m{color:var(--muted);font-size:14px}
.gap{display:inline-block;min-width:54px;border-bottom:2px solid var(--accent);color:var(--accent);margin:0 1px}

/* Profil */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:700}
.stat span{font-size:13px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;grid-auto-flow:column;gap:3px;margin-top:12px}
.heat i{border-radius:3px;background:var(--soft)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--soft))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--soft))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--soft))}
.heat i.l4{background:var(--accent)}
.ach{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center}
.ach.got .ic{background:var(--accent-soft);color:var(--accent)}
.ach .tx{flex:1;min-width:0}
.ach b{font-weight:600}
.ach .bar{height:4px;margin-top:7px}
.tiers{display:flex;gap:4px}
.tiers span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:11px;font-weight:700;background:var(--soft);color:var(--line)}
.tiers span.t1{background:#c58a52;color:#fff}
.tiers span.t2{background:#9aa3ab;color:#fff}
.tiers span.t3{background:#c9a13b;color:#fff}

/* Overlays */
.toast{position:fixed;left:50%;top:16px;z-index:60;transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;max-width:90vw;text-align:center;transition:transform .45s cubic-bezier(.2,1.3,.4,1);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{transform:translate(-50%,0)}
.toast small{display:block;font-weight:400;opacity:.75;margin-top:2px}
.overlay{position:fixed;inset:0;z-index:55;background:rgba(20,15,10,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.overlay .card{text-align:center;max-width:340px;width:100%;padding:30px 24px;transform:scale(.9);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.overlay.show .card{transform:scale(1)}
.lvnum{font-family:'Cinzel',serif;font-size:72px;font-weight:700;color:var(--accent);line-height:1.1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:58}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.06)}}
.enter{animation:enter .3s ease}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 120px var(--bad);opacity:0}
.flash.on{animation:fl .5s}
@keyframes fl{30%{opacity:.6}}
.note{font-size:14px;color:var(--muted);padding:12px 14px;border-radius:12px;background:var(--soft);margin-top:10px}
.note b{color:var(--ink)}
@media (max-width:420px){.prompt .w{font-size:34px}.face .w{font-size:32px}.ptitle{font-size:26px}}
.wrow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.wrow:last-child{border-bottom:0}.wrow .lat{font-size:17px;font-weight:600}.wrow .muted{text-align:right}.picker select{font-size:16px;padding:12px 14px;font-weight:600}
.sfield{margin-bottom:10px}.sfield label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px 2px}.sfield .typein{font-size:21px;padding:12px}
.testcard{border-color:var(--accent)}.testcard.soon{background:var(--accent-soft)}.countdown{text-align:center;min-width:64px}.countdown b{display:block;font-size:34px;font-weight:700;color:var(--accent);line-height:1}.countdown span{font-size:12px;color:var(--muted)}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function roman(n){const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const[v,c]of m)while(n>=v){r+=c;n-=v}return r}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,'').replace(/[^a-zäöüß ]/g,'').replace(/\s+/g,' ').trim();
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function anim(el,c){if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function copyText(t,btn,isShare){const done=()=>{const o=btn.innerHTML;btn.innerHTML=I('check')+'Kopiert';setTimeout(()=>btn.innerHTML=o,1800);if(isShare)bump('shared',1)};
  try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,btn))}catch(e){fallbackCopy(t,btn)}}
function fallbackCopy(t,btn){const ta=document.createElement('textarea');ta.value=t;ta.className='code';ta.style.marginTop='10px';btn.after(ta);ta.select();toast('Bitte den markierten Text selbst kopieren')}

let actx=null;
function tone(f,d=.12,type='sine',vol=.12,delay=0,slide=0){if(!S.sound)return;try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={good(c=0){const b=587*Math.pow(1.06,Math.min(c,10));tone(b,.09,'triangle');tone(b*1.5,.13,'triangle',.1,.06)},
  bad(){tone(196,.22,'triangle',.12,0,130)},tap(){tone(880,.03,'sine',.05)},flip(){tone(520,.06,'sine',.06,0,780)},
  hit(){tone(220,.12,'triangle',.14,0,90)},crit(){tone(1046,.07,'triangle',.1);tone(262,.2,'triangle',.12,.03,80)},
  hurt(){tone(147,.3,'sawtooth',.08,0,70)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.1,i*.08))},
  level(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.1,i*.09))}};
function speak(t){try{const u=new SpeechSynthesisUtterance(t.split(',')[0]);const vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>/^la/i.test(v.lang))||vs.find(v=>/^it/i.test(v.lang))||null;u.lang=u.voice?u.voice.lang:'it-IT';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('Vorlesen geht in diesem Browser nicht')}}

const fx=$('fx'),fc=fx.getContext('2d');let parts=[],fxRun=false;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}
function confetti(n=70){const cs=[getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#a3241c','#b0883a','#d9c39a'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,life:1,c:cs[i%3],s:Math.random()*5+4,r:Math.random()*6,vr:(Math.random()-.5)*.3});
  if(fxRun)return;fxRun=true;(function loop(){fc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0&&p.y<innerHeight+20);
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.98;p.life-=.012;p.r+=p.vr;fc.save();fc.globalAlpha=Math.max(0,p.life);fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore()}
    if(parts.length)requestAnimationFrame(loop);else{fxRun=false;fc.clearRect(0,0,fx.width,fx.height)}})()}

function statVal(id){return id==='level'?level():id==='streak'?S.streak:id==='quiz'?S.best:id==='lessons'?S.lessons.length:id==='mastered'?Object.values(S.box).filter(b=>b>=5).length:(S.stats[id]||0)}
function bump(id,v,max){S.stats[id]=max?Math.max(S.stats[id]||0,v):(S.stats[id]||0)+v;checkAch()}
function checkAch(silent){ACH.forEach(a=>{const v=statVal(a.id),have=S.medals[a.id]||0;let t=0;a.g.forEach((g,i)=>{if(v>=g)t=i+1});
  if(t>have){S.medals[a.id]=t;if(!silent){SFX.win();toast(a.n+' '+roman(t),a.d(a.g[t-1]))}}});save()}
function addXp(n){if(n<=0){save();return}const before=level(),k=iso();S.xp+=n;
  const had=(S.hist[k]||0)>=50;S.hist[k]=(S.hist[k]||0)+n;const ks=Object.keys(S.hist).sort();if(ks.length>140)ks.slice(0,ks.length-140).forEach(x=>delete S.hist[x]);
  if(S.lastDay!==k){const y=iso(new Date(Date.now()-DAY));S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=k;if(S.streak>1)toast(S.streak+' Tage am Stück','Weiter so!')}
  if(!had&&S.hist[k]>=50)toast('Tagesziel erreicht','50 XP heute');
  save();checkAch();
  if(level()>before)setTimeout(()=>{$('ovl').innerHTML=`<div class="card"><div class="small" style="letter-spacing:3px;font-weight:600">NEUER GRADUS</div><div class="lvnum">${roman(level())}</div>

function parseForms(w){const raw=w.la.replace(/\(.*?\)/g,'').trim(),parts=raw.split(',').map(x=>x.trim()).filter(Boolean);
  if(parts.length>=3&&!parts[0].includes(' ')&&/(are|ere|ire)$/.test(norm(parts[0])))return{kind:'v',lemma:parts[0],fields:[['1. Person Sg. Präsens',parts[1]],['Perfekt',parts[2]]].concat(parts[3]?[['PPP',parts[3]]]:[])};
  if(parts.length===2){const m=parts[1].match(/^(\S+)\s+(m|f|n)\.?$/);if(m)return{kind:'n',lemma:parts[0],fields:[['Genitiv',m[1]],['Geschlecht (m, f oder n)',m[2]]]}}return null}
const lemmaOf=w=>w.la.replace(/\(.*?\)/g,'').split(',')[0].trim();
function lemmaOk(w,v){const l=lemmaOf(w);return [l,...l.split(/[\/!]/)].map(norm).filter(Boolean).includes(norm(v))}
function fieldOk(label,sol,v){return label.startsWith('Geschlecht')?norm(v).charAt(0)===sol:norm(v)===norm(sol)}
function formFields(F){return F.fields.map((f,i)=>`<div class="sfield"><label>${f[0]}</label><input type="text" class="typein" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`).join('')}
function wireFields(box,done){const ins=[...box.querySelectorAll('input')];ins.forEach((inp,i)=>inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();if(i<ins.length-1&&!inp.readOnly)ins[i+1].focus();else done()}));setTimeout(()=>ins[0]&&ins[0].focus(),60)}
let stQ=[],stCur=null,stF=null,stOk=0,stN=0,stDone=false;
function startStamm(){if(!needDeck())return;const pool=shuffle(deck()).filter(w=>parseForms(w));
  if(!pool.length){toast('Keine Stammformen in dieser Lektion','Verben und Nomen brauchen Genitiv bzw. Perfekt');return}
  mode='stamm';stQ=pool.slice(0,15);stN=stQ.length;stOk=0;missed=[];again=startStamm;
  gameFrame(`<div class="prompt"><div class="w lat" id="sw"></div><div class="h" id="sh"></div></div><div id="sf"></div><div class="fb" id="sfb"></div><button class="btn full" id="sbtn" onclick="checkStamm()">Prüfen</button>`);nextStamm()}
function nextStamm(){if(!stQ.length)return result({big:stOk+'/'+stN,title:stOk===stN?'Optime! Alle Stammformen sitzen':stOk>=stN*.7?'Bene!':'Weiter üben',sub:'Stammformen komplett richtig',xp:stOk*3+2,again:startStamm});
  stCur=stQ.shift();stF=parseForms(stCur);stDone=false;setProg(stN-stQ.length-1,stN);$('sw').textContent=stF.lemma;anim($('sw'),'pop');
  $('sh').textContent=stCur.de+' · '+(stF.kind==='v'?'Verb':'Nomen');$('sf').innerHTML=formFields(stF);$('sfb').className='fb';$('sbtn').textContent='Prüfen';wireFields($('sf'),checkStamm)}
function checkStamm(){if(mode!=='stamm')return;if(stDone)return nextStamm();stDone=true;let all=true;
  $('sf').querySelectorAll('input').forEach(inp=>{const [lab,sol]=stF.fields[+inp.dataset.i],ok=fieldOk(lab,sol,inp.value);inp.readOnly=true;inp.classList.add(ok?'ok':'err');if(!ok)all=false});
  learn(stCur,all);const sol=stF.fields.map(f=>f[1]).join(', ');
  if(all){stOk++;SFX.good(stOk);fb('sfb','ok',I('check')+'<span>Alles richtig: <b>'+esc(stF.lemma+', '+sol)+'</b></span>')}
  else{SFX.bad();anim($('sf'),'shake');missed.push({a:stF.lemma,b:sol});fb('sfb','err',I('x')+'<span>Richtig: <b>'+esc(stF.lemma+', '+sol)+'</b></span>')}
  $('sbtn').textContent='Weiter'}

/* ================= Vokabeltest mit Note ================= */
let tsQ=[],tsI=0,tsAns=[];
function startTest(){if(!needDeck())return;mode='test';const words=shuffle(deck()),n=Math.min(20,words.length);let sc=0;tsQ=[];
  words.slice(0,n).forEach((w,i)=>{const F=parseForms(w);if(F&&sc<5&&i%4===3){sc++;tsQ.push({t:'st',w,F})}else tsQ.push({t:i%2?'dl':'ld',w})});
  tsI=0;tsAns=[];missed=[];again=startTest;
  gameFrame(`<div class="prompt"><div class="small" style="letter-spacing:2px;font-weight:600" id="tst"></div><div class="w lat" id="tsw"></div><div class="h" id="tsh"></div></div><div id="tsf"></div>
    <button class="btn full" id="tsbtn" onclick="saveTest()" style="margin-top:14px">Weiter</button><p class="small center" style="margin-top:12px">Wie im echten Test: Die Lösungen siehst du erst am Ende.</p>`);nextTest()}
function nextTest(){if(tsI>=tsQ.length)return endTest();const Q=tsQ[tsI];setProg(tsI,tsQ.length);
  if(Q.t==='ld'){$('tst').textContent='LATEIN → DEUTSCH';$('tsw').textContent=Q.w.la;$('tsh').textContent='Was bedeutet das?';$('tsf').innerHTML='<input type="text" class="typein" data-i="0" placeholder="Deutsche Bedeutung" autocomplete="off" spellcheck="false">'}
  else if(Q.t==='dl'){$('tst').textContent='DEUTSCH → LATEIN';$('tsw').textContent=Q.w.de;$('tsh').textContent='Wie heißt das auf Latein? (Grundform)';$('tsf').innerHTML='<input type="text" class="typein" data-i="0" placeholder="Lateinisches Wort" autocomplete="off" autocapitalize="off" spellcheck="false">'}
  else{$('tst').textContent='STAMMFORMEN';$('tsw').textContent=Q.F.lemma;$('tsh').textContent=Q.w.de;$('tsf').innerHTML=formFields(Q.F)}
  anim($('tsw'),'pop');wireFields($('tsf'),saveTest)}
function saveTest(){if(mode!=='test')return;tsAns[tsI]=[...$('tsf').querySelectorAll('input')].map(i=>i.value);SFX.tap();tsI++;nextTest()}
function endTest(){let pts=0,max=0;
  tsQ.forEach((Q,i)=>{const a=tsAns[i]||[];
    if(Q.t==='ld'){max++;const acc=Q.w.de.split(/[,;\/!]/).map(x=>norm(x).replace(/^(der|die|das|den|dem|des|ein|eine) /,'')).filter(Boolean),v=norm(a[0]||'').replace(/^(der|die|das|den|dem|des|ein|eine) /,'');
      const ok=!!v&&acc.some(x=>x===v||(x.length>4&&v.length>3&&x.startsWith(v)&&x.length-v.length<=1));learn(Q.w,ok);if(ok)pts++;else missed.push({a:Q.w.la,b:Q.w.de+(a[0]?' (du: '+a[0]+')':'')})}
    else if(Q.t==='dl'){max++;const ok=lemmaOk(Q.w,a[0]||'');learn(Q.w,ok);if(ok)pts++;else missed.push({a:Q.w.de,b:lemmaOf(Q.w)+(a[0]?' (du: '+a[0]+')':'')})}
    else{let all=true;Q.F.fields.forEach((f,k)=>{max++;if(fieldOk(f[0],f[1],a[k]||''))pts++;else all=false});if(!all)missed.push({a:Q.F.lemma,b:Q.F.fields.map(f=>f[1]).join(', ')})}});
  const p=Math.round(pts/max*100),note=p>=92?1:p>=81?2:p>=67?3:p>=50?4:p>=30?5:6;if(note<=2)confetti();
  result({big:'Note '+note,title:['','Sehr gut! Optime!','Gut! Bene!','Befriedigend','Ausreichend','Mangelhaft, weiter üben','Ungenügend, weiter üben'][note],sub:pts+' von '+max+' Punkten ('+p+' %)',xp:pts*2+5,again:startTest})}

/* ================= Blitz-Quiz ================= */
let qInt=null,qScore=0,qCombo=0,qOk=0,qN=0,qCur=null;
function startQuiz(){if(!needDeck())return;mode='quiz';qScore=0;qCombo=0;qOk=0;qN=0;missed=[];
  gameFrame(`<div class="combo" id="combo"></div><div class="prompt"><div class="w lat" id="qw"></div></div><div class="answers" id="qa"></div>`,'60s');
  const t0=Date.now();clearInterval(qInt);qInt=setInterval(()=>{const l=60-(Date.now()-t0)/1000;if(!$('gbar')){clearInterval(qInt);return}$('gbar').style.width=(100-Math.max(0,l)/60*100)+'%';$('gcnt').textContent=Math.ceil(Math.max(0,l))+'s';if(l<=0){clearInterval(qInt);endQuiz()}},100);nextQ()}
function nextQ(){qCur=weighted();$('qw').textContent=qCur.la;anim($('qw'),'pop');
  answers('qa',options(qCur).map(o=>({label:o.de,ok:o===qCur})),ok=>{if(mode!=='quiz')return;qN++;learn(qCur,ok);
    if(ok){qCombo++;qOk++;const p=10+Math.min(qCombo-1,10)*5;qScore+=p;SFX.good(qCombo);$('combo').textContent=qCombo>1?'Serie '+qCombo+' · +'+p:'+'+p;bump('combo',qCombo,true)}
    else{qCombo=0;SFX.bad();anim($('view'),'shake');$('combo').textContent='';missed.push({a:qCur.la,b:qCur.de})}
    setTimeout(()=>{if(mode==='quiz')nextQ()},ok?350:900)})}
function endQuiz(){const rec=qScore>S.best&&qScore>0;if(rec)S.best=qScore;if(rec)confetti();
  result({big:qScore,title:rec?'Neuer Rekord!':'Zeit abgelaufen',sub:qOk+' von '+qN+' richtig',xp:Math.round(qScore/10),again:startQuiz})}

function startType(){if(!needDeck())return;mode='type';tQ=shuffle(deck()).slice(0,15);tN=tQ.length;tOk=0;missed=[];

function nextT(){if(!tQ.length)return endT();tDone=false;tCur=tQ.shift();$('tw').textContent=tCur.la;anim($('tw'),'pop');const i=$('ti');i.value='';i.className='typein';i.readOnly=false;

function checkT(){if(mode!=='type')return;if(tDone)return nextT();tDone=true;const art=x=>norm(x).replace(/^(der|die|das|den|dem|des|ein|eine) /,''),a=art($('ti').value),acc=tCur.de.split(/[,;\/!]/).map(art).filter(Boolean);

  if(ok){tOk++;SFX.good(tOk);$('ti').classList.add('ok');fb('tfb','ok',I('check')+'<span>Richtig: <b>'+esc(tCur.de)+'</b></span>')}
  else{SFX.bad();$('ti').classList.add('err');anim($('ti'),'shake');missed.push({a:tCur.la,b:tCur.de});fb('tfb','err',I('x')+'<span>Richtig wäre: <b>'+esc(tCur.de)+'</b></span>')}
  $('tbtn').textContent='Weiter'}

let dQ=[],dI=0,dRes=[],dT0=0,dR=null;
function startDaily(){if(!needDeck())return;mode='daily';const d=deck(),k=iso();dR=rng(hashStr(k+'|'+d.map(w=>w.la).sort().join('|')));
  dQ=shuffle(d,dR);while(dQ.length<15)dQ=dQ.concat(shuffle(d,dR));dQ=dQ.slice(0,15);dI=0;dRes=[];missed=[];dT0=Date.now();
  gameFrame(`<div class="prompt"><div class="small" style="letter-spacing:2px;font-weight:600">EXAMEN COTTIDIANUM</div><div class="w lat" id="dw"></div></div><div class="answers" id="da"></div>`);nextD()}
function nextD(){if(dI>=15)return endD();const c=dQ[dI];setProg(dI,15);$('dw').textContent=c.la;anim($('dw'),'pop');
  answers('da',options(c,dR).map(o=>({label:o.de,ok:o===c})),ok=>{if(mode!=='daily')return;dRes.push(ok);learn(c,ok);ok?SFX.good(dI):(SFX.bad(),missed.push({a:c.la,b:c.de}));dI++;setTimeout(nextD,ok?380:950)})}
function endD(){const sec=Math.round((Date.now()-dT0)/1000),time=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),n=dRes.filter(Boolean).length,k=iso(),first=!S.daily[k];

  shareText='Arena Vocabulorum · Examen '+new Date().toLocaleDateString('de-DE')+'\n'+act+'\n'+n+'/15 in '+time+'\n'+dRes.map(r=>r?'🟩':'🟥').join('');
  if(n>=13)confetti();result({big:n+'/15',title:n===15?'Perfectum!':n>=12?'Optime!':n>=8?'Bene!':'Weiter üben',sub:'Zeit '+time+(first?'':' · nur der erste Versuch zählt'),xp:first?n*2+5:2,squares:dRes,share:true,again:startDaily})}

let bInt=null,bLives=3,bKills=0,bI=0,bHp=0,bMax=0,bCur=null,bCombo=0,bT0=0,bOk=0;
function startBoss(){if(!needDeck())return;mode='boss';bLives=3;bKills=0;bI=0;bCombo=0;bOk=0;missed=[];
  view(`<div class="game-top"><button class="x" onclick="quit()">${I('x')}</button><div class="lives" id="lives"></div><div style="flex:1"></div><div class="cnt" id="kills"></div></div>
    <div class="arena" id="arena" style="position:relative"><div class="blvl" id="blvl"></div><div class="medal" id="medal"></div><div class="bname" id="bname"></div><div class="small" id="bde"></div>
    <div class="hp"><div id="bhp"></div></div><div class="timer" style="max-width:300px;margin:8px auto 0"><div id="btm"></div></div><div class="combo" id="bcombo"></div></div>
    <div class="prompt" style="margin:6px 0 18px"><div class="w lat" id="bw"></div></div><div class="answers" id="ba"></div>`,false);spawn()}
function bossUi(){$('bhp').style.width=Math.max(0,bHp/bMax*100)+'%';$('lives').innerHTML=[0,1,2].map(i=>I('heart',i<bLives?'':'off')).join('');$('kills').textContent=bKills+' besiegt'}
function spawn(){const b=BOSSES[bI%BOSSES.length],round=Math.floor(bI/BOSSES.length);bMax=40+bI*20+round*60;bHp=bMax;
  $('blvl').textContent='MONSTRVM '+roman(bI+1);$('bname').textContent=b.n+(round?' '+roman(round+1):'');$('bde').textContent=b.de;
  const m=$('medal');m.className='medal';m.textContent=b.l;bossUi();tone(110,.5,'sawtooth',.06,0,70);setTimeout(()=>{if(mode==='boss')nextB()},450)}
function nextB(){bCur=weighted();$('bw').textContent=bCur.la;anim($('bw'),'pop');answers('ba',options(bCur).map(o=>({label:o.de,ok:o===bCur})),hitB);
  clearInterval(bInt);bT0=Date.now();const lim=Math.max(5,9-Math.floor(bI/2)*.5);
  bInt=setInterval(()=>{const l=lim-(Date.now()-bT0)/1000;if(!$('btm')){clearInterval(bInt);return}$('btm').style.width=Math.max(0,l/lim*100)+'%';if(l<=0){clearInterval(bInt);$('ba').dataset.lock=1;[...$('ba').children].forEach(x=>x.dataset.ok==1?x.classList.add('right'):x.classList.add('dim'));hitB(false)}},80)}
function dmgTxt(t,c){const d=document.createElement('div');d.className='dmg'+(c?' crit':'');d.textContent=t;d.style.setProperty('--dx',(Math.random()*80-40)+'px');$('arena').appendChild(d);setTimeout(()=>d.remove(),900)}
function hitB(ok){if(mode!=='boss')return;clearInterval(bInt);const m=$('medal');learn(bCur,ok);
  if(ok){bCombo++;bOk++;const crit=(Date.now()-bT0)/1000<2.5||Math.random()<.12;let d=10+Math.min(bCombo,10)*2;if(crit)d*=2;bHp-=d;
    anim(m,'hit');crit?SFX.crit():SFX.hit();dmgTxt((crit?'Kritisch −':'−')+d,crit);$('bcombo').textContent=bCombo>1?'Serie '+bCombo:'';bump('combo',bCombo,true);bossUi();
    if(bHp<=0){bKills++;bI++;m.classList.add('dead');SFX.win();bump('kills',1);bump('bossRun',bKills,true);toast(BOSSES[(bI-1)%BOSSES.length].n+' besiegt');
      if(bKills%2===0&&bLives<3){bLives++;toast('Ein Leben zurück')}bossUi();setTimeout(()=>{if(mode==='boss')spawn()},1300);return}}
  else{bCombo=0;bLives--;$('bcombo').textContent='';missed.push({a:bCur.la,b:bCur.de});anim(m,'atk');SFX.hurt();anim($('view'),'shake');redFlash();bossUi();
    if(bLives<=0){setTimeout(endBoss,1000);return}}
  setTimeout(()=>{if(mode==='boss')nextB()},ok?420:1100)}
function endBoss(){if(bKills>=3)confetti();result({big:bKills,title:bKills?(bKills>=3?'Heros!':'Bene pugnavisti!'):'Vae victis!',sub:bKills?bOk+' Treffer':'Das Monster war diesmal stärker',xp:bKills*15+bOk*2,again:startBoss})}

/* ================= Grammatik mit den Lektionswörtern ================= */
const plain=x=>x.normalize('NFD').replace(/[̄̆]/g,'').normalize('NFC');
function deriveNoun(w){const raw=plain(w.la.replace(/\(.*?\)/g,'')).trim();if(/Pl\.|\//.test(raw))return null;const p=raw.split(',').map(x=>x.trim());if(p.length!==2)return null;
  const m=p[1].match(/^([a-z]+)\s+(m|f|n)\.$/);if(!m||!/^[a-z]+$/.test(p[0]))return null;const nom=p[0],gen=m[1],g=m[2];
  if(['domus','deus','vis','iter','fides','spes','plebs','ops','ius'].includes(nom))return null;let d=null;
  if(gen.endsWith('ae')&&nom.endsWith('a'))d='a';
  else if(gen.endsWith('i')&&!gen.endsWith('ei')){if(nom.endsWith('us')&&g!=='n')d='o';else if(nom.endsWith('um')&&g==='n')d='on';else if(/(er|ir)$/.test(nom)&&g==='m')d='or'}
  else if(gen.endsWith('ei')&&nom.endsWith('es'))d='e';
  else if(gen.endsWith('us')&&nom.endsWith('us')&&nom===gen)d='u';
  else if(gen.endsWith('is')){const st=gen.slice(0,-2);if(/[^aeiou][^aeiou]$/.test(st)||/(is|es)$/.test(nom)&&nom.length>=gen.length||(g==='n'&&/(e|al|ar)$/.test(nom)))return null;d=g==='n'?'kn':'k'}
  return d?{nom,gen,g,de:w.de,d,own:true}:null}
function deriveVerb(w){const raw=plain(w.la.replace(/\(.*?\)/g,'')).trim();if(/\s/.test(raw.replace(/,\s*/g,',')))return null;const p=raw.split(',').map(x=>x.trim()).filter(Boolean);
  if(p.length<2)return null;const [inf,pr,pf]=p;if(!/^[a-z]+$/.test(inf)||!/^[a-z]+$/.test(pr))return null;
  if(/(sse|rre|lle)$/.test(inf)||/eo$/.test(pr)&&/ire$/.test(inf))return null;let c=null;
  const orig=w.la.split(',')[0];if(/āre$/.test(orig))c='a';else if(/ēre$/.test(orig))c='e';else if(/īre$/.test(orig))c='i';else if(/ere$/.test(orig))c=/io$/.test(pr)?'m':'k';
  if(!c)return null;if(c==='a'&&!pr.endsWith('o'))return null;if(c==='e'&&!pr.endsWith('eo'))return null;if(c==='i'&&!pr.endsWith('io'))return null;
  return{inf,perf:pf&&/^[a-z]+i$/.test(pf)?pf:null,de:w.de,c,own:true}}
function gNouns(f){const own=S.gramSrc==='all'?[]:deck().map(deriveNoun).filter(Boolean).filter(n=>!f||n.d===f);return own.length>=2?own:NOUNS.filter(n=>!f||n.d===f)}
function gVerbs(f){const own=S.gramSrc==='all'?[]:deck().map(deriveVerb).filter(Boolean).filter(v=>!f||v.c===f);return own.length>=2?own:VERBS.filter(v=>!f||v.c===f)}
const nT=v=>verbForms(v).length;
function gramInfo(){const n=deck().map(deriveNoun).filter(Boolean).length,v=deck().map(deriveVerb).filter(Boolean).length;return{n,v}}

/* --- allgemeiner Ablauf für 10 Grammatikfragen --- */
let gQ=[],gI=0,gOk=0,gKind='',gDone=false,gStat='gram';
function runGram(kind,make,title,stat){mode='gram';gKind=kind;gStat=stat;gQ=Array.from({length:10},make);gI=0;gOk=0;missed=[];again=()=>runGram(kind,make,title,stat);
  gameFrame(`<div class="prompt" id="gp"></div><div id="ga"></div><div class="fb" id="gfb"></div><div id="gnext"></div>`);nextG(title)}
function nextG(title){if(gI>=gQ.length)return endG(title);const Q=gQ[gI];gDone=false;setProg(gI,gQ.length);
  $('gp').innerHTML=Q.prompt;anim($('gp'),'pop');$('gfb').className='fb';$('gnext').innerHTML='';
  if(Q.opts){$('ga').innerHTML='<div class="answers" id="gans"></div>';answers('gans',Q.opts,ok=>{gradeG(ok,Q);$('gnext').innerHTML=`<button class="btn full" onclick="gI++;nextG('${title}')">Weiter</button>`})}
  else{$('ga').innerHTML=`<input type="text" class="typein" id="gin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${Q.ph||'Antwort'}">`;
    $('gnext').innerHTML=`<button class="btn full" id="gbtn">Prüfen</button>`;
    const go2=()=>{if(gDone){gI++;nextG(title);return}const v=norm($('gin').value);if(!v)return;const ok=Q.answers.some(a=>norm(a)===v);$('gin').readOnly=true;$('gin').classList.add(ok?'ok':'err');if(!ok)anim($('gin'),'shake');gradeG(ok,Q);$('gbtn').textContent='Weiter'};
    $('gbtn').onclick=go2;$('gin').addEventListener('keydown',e=>{if(e.key==='Enter')go2()});setTimeout(()=>{const g=$('gin');g&&g.focus()},50)}}
function gradeG(ok,Q){gDone=true;if(ok){gOk++;SFX.good(gOk);bump('gram',1);if(gStat!=='gram')bump(gStat,1)}else{SFX.bad();missed.push({a:Q.miss[0],b:Q.miss[1]})}
  fb('gfb',ok?'ok':'err',(ok?I('check'):I('x'))+'<span>'+(ok?'Richtig! ':'Richtig: ')+Q.explain+'</span>')}
function endG(title){if(gOk===10)confetti();result({big:gOk+'/10',title:gOk>=9?'Optime!':gOk>=6?'Bene!':'Weiter üben',sub:title,xp:gOk*2+(gOk===10?5:0),again})}
const P=(w,h,t)=>`<div class="w lat">${w}</div>${h?`<div class="h">${h}</div>`:''}${t?`<div class="t">${t}</div>`:''}`;
const nLabel=(c,n)=>CASES[c]+' '+(n?'Plural':'Singular'),vLabel=(t,p)=>PERS[p]+' '+TENSES[t];

/* Formen bestimmen */
function mkForms(){if(Math.random()<.5){const w=pick(gNouns()),F=nounForms(w),all=[];F.forEach((r,n)=>r.forEach((f,c)=>all.push({f,l:nLabel(c,n)})));
    const t=pick(all),set=all.filter(x=>x.f===t.f).map(x=>x.l),wrong=shuffle([...new Set(all.map(x=>x.l))].filter(l=>!set.includes(l))).slice(0,3);
    return{prompt:P(esc(t.f),esc(nounHead(w))+' – '+esc(w.de)),opts:shuffle([{label:t.l,ok:true},...wrong.map(l=>({label:l,ok:false}))]),
      explain:'<b>'+esc(t.f)+'</b> = '+set.join(' oder '),miss:[t.f,set.join(' / ')]}}
  const v=pick(gVerbs()),F=verbForms(v),all=[];F.forEach((r,t)=>r.forEach((f,p)=>all.push({f,l:vLabel(t,p)})));
  const t=pick(all),set=all.filter(x=>x.f===t.f).map(x=>x.l);const [pp,tt]=[t.l.slice(0,6),t.l.slice(7)];
  let near=all.filter(x=>!set.includes(x.l)&&(x.l.startsWith(pp)||x.l.endsWith(tt))).map(x=>x.l);if(near.length<3)near=all.filter(x=>!set.includes(x.l)).map(x=>x.l);
  const wrong=shuffle([...new Set(near)]).slice(0,3);
  return{prompt:P(esc(t.f),esc(verbHead(v))+' – '+esc(v.de)),opts:shuffle([{label:t.l,ok:true},...wrong.map(l=>({label:l,ok:false}))]),explain:'<b>'+esc(t.f)+'</b> = '+set.join(' oder '),miss:[t.f,set.join(' / ')]}}
function startForms(){runGram('forms',mkForms,'Formen bestimmen','forms')}

/* Form bilden */
function mkBuild(){if(Math.random()<.5){const w=pick(gNouns()),F=nounForms(w),c=Math.floor(Math.random()*5),n=Math.floor(Math.random()*2);if(c===0&&n===0)return mkBuild();const a=F[n][c];
    return{prompt:P(esc(nounHead(w)),esc(w.de),nLabel(c,n)),answers:[a],ph:'Lateinische Form',explain:'<b>'+esc(a)+'</b>',miss:[nounHead(w)+' → '+nLabel(c,n),a]}}
  const v=pick(gVerbs()),F=verbForms(v),t=Math.floor(Math.random()*F.length),p=Math.floor(Math.random()*6),a=F[t][p];
  return{prompt:P(esc(verbHead(v)),esc(v.de),vLabel(t,p)),answers:[a],ph:'Lateinische Form',explain:'<b>'+esc(a)+'</b>',miss:[v.inf+' → '+vLabel(t,p),a]}}

/* Umwandeln */
function mkChange(){if(Math.random()<.45){for(let k=0;k<20;k++){const w=pick(gNouns()),F=nounForms(w),c=Math.floor(Math.random()*5),n=Math.floor(Math.random()*2),src=F[n][c];
      const an=[];F.forEach((r,n2)=>r.forEach((f,c2)=>{if(f===src)an.push([n2,c2])}));if(new Set(an.map(x=>x[0])).size>1)continue;
      const tg=[...new Set(an.map(([n2,c2])=>F[1-n2][c2]))];const lbl=n?'in den Singular':'in den Plural';
      return{prompt:P(esc(src),esc(nounHead(w))+' – '+esc(w.de),lbl),answers:tg,ph:'Umgewandelte Form',explain:'<b>'+esc(tg.join(' / '))+'</b>',miss:[src+' → '+lbl,tg.join(' / ')]}}}
  const v=pick(gVerbs()),F=verbForms(v),t=Math.floor(Math.random()*F.length),p=Math.floor(Math.random()*6),src=F[t][p];
  const an=[];F.forEach((r,t2)=>r.forEach((f,p2)=>{if(f===src)an.push([t2,p2])}));let tg,lbl;
  if(Math.random()<.5){lbl=p<3?'in den Plural':'in den Singular';tg=an.map(([t2,p2])=>F[t2][(p2+3)%6])}
  else if(F.length>1){let nt;do{nt=Math.floor(Math.random()*F.length)}while(nt===t);lbl='ins '+TENSES[nt];tg=an.map(([t2,p2])=>F[nt][p2])}
  tg=[...new Set(tg)];return{prompt:P(esc(src),esc(verbHead(v))+' – '+esc(v.de),lbl),answers:tg,ph:'Umgewandelte Form',explain:'<b>'+esc(tg.join(' / '))+'</b>',miss:[src+' → '+lbl,tg.join(' / ')]}}
function startChange(){runGram('change',mkChange,'Umwandeln','gram')}

    answers:[a,full],ph:'Endung oder ganzes Wort',explain:'<b>'+esc(stem)+'<u>'+esc(a)+'</u></b> – '+esc(s.replace('_',a)),miss:[s.replace('_','…'),full]}}

/* Deklinieren / Konjugieren (Tabellen) */
let tW=null,tT=0,tKind='',tChecked=false;
function tableFrame(sel,body){view(`<div class="game-top"><button class="x" onclick="go('grammar')">${I('back')}</button><div style="flex:1"></div>${sel}</div>
  <div class="card"><div class="whead" id="th"></div><div class="scroll"><table class="gt" id="tt"></table></div><div class="fb" id="tfb2"></div>
  <div class="row"><button class="btn sec" style="flex:1" onclick="${body}()">${I('refresh')}Neu</button><button class="btn" style="flex:1" id="tbtn2" onclick="checkTable()">Prüfen</button></div></div>`,false)}
function openDecl(){tableFrame(`<select id="dsel" onchange="newDecl()"><option value="">Alle Deklinationen</option>${Object.entries(DECL).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select>`,'newDecl');newDecl()}
function newDecl(){tKind='d';tChecked=false;const f=$('dsel').value,pool=gNouns(f);let w;do{w=pick(pool)}while(pool.length>1&&w===tW);tW=w;
  $('th').innerHTML=`<div class="w">${esc(nounHead(w))}</div><div class="m">${esc(w.de)} · ${DECL[w.d].n}</div>`;
  $('tt').innerHTML='<tr><th></th><th>Singular</th><th>Plural</th></tr>'+CASES.map((c,ci)=>`<tr><td>${c}</td>${[0,1].map(n=>`<td><input type="text" data-n="${n}" data-c="${ci}" autocomplete="off" autocapitalize="off" spellcheck="false" ${!n&&!ci?`value="${w.nom}" readonly`:''}></td>`).join('')}</tr>`).join('');
  prepTable()}
function openConj(){tableFrame(`<select id="csel" onchange="newConj()"><option value="">Alle Konjugationen</option>${Object.entries(CONJ).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
  <select id="zsel" onchange="newConj()"><option value="">Alle Zeiten</option>${TENSES.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}</select>`,'newConj');newConj()}
function newConj(){tKind='c';tChecked=false;const f=$('csel').value,z=$('zsel').value,pool=gVerbs(f);let v;do{v=pick(pool)}while(pool.length>1&&v===tW);tW=v;
  tT=z===''?Math.floor(Math.random()*nT(v)):Math.min(+z,nT(v)-1);
  $('th').innerHTML=`<div class="w">${esc(verbHead(v))}</div><div class="m">${esc(v.de)} · ${v.c==='irr'?'unregelmäßig':CONJ[v.c]}</div><div class="prompt" style="margin:8px 0 0"><span class="t" style="margin:0">${TENSES[tT]}</span></div>`;
  $('tt').innerHTML='<tr><th></th><th>Form</th></tr>'+PERS.map((p,i)=>`<tr><td>${p}<div class="small" style="font-size:12px">${PRON[i]}</div></td><td><input type="text" data-p="${i}" autocomplete="off" autocapitalize="off" spellcheck="false"></td></tr>`).join('');
  prepTable()}
function prepTable(){$('tfb2').className='fb';$('tbtn2').textContent='Prüfen';const ins=[...$('tt').querySelectorAll('input:not([readonly])')];
  ins.forEach((inp,i)=>inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();if(tChecked||i===ins.length-1)checkTable();else ins[i+1].focus()}));
  if(matchMedia('(pointer:fine)').matches)setTimeout(()=>ins[0]&&ins[0].focus(),60)}
function checkTable(){if(tChecked)return tKind==='d'?newDecl():newConj();tChecked=true;let ok=0,n=0;const F=tKind==='d'?nounForms(tW):verbForms(tW)[tT];
  $('tt').querySelectorAll('input').forEach(inp=>{if(inp.readOnly)return;n++;const sol=tKind==='d'?F[+inp.dataset.n][+inp.dataset.c]:F[+inp.dataset.p];
    const r=norm(inp.value)===norm(sol);inp.readOnly=true;inp.classList.add(r?'ok':'err');if(r)ok++;else{const s=document.createElement('span');s.className='sol';s.textContent=sol;inp.after(s)}});
  bump('gram',ok);if(ok===n){bump('tables',1);SFX.win();confetti(40);fb('tfb2','ok',I('check')+'<span><b>Optime!</b> Alles richtig. +'+(ok+5)+' XP</span>');addXp(ok+5)}
  else{ok?SFX.good():SFX.bad();fb('tfb2','err',I('x')+'<span>'+ok+' von '+n+' richtig. +'+ok+' XP</span>');addXp(ok)}$('tbtn2').textContent='Nächste'}

const hl=(f,n)=>esc(f.slice(0,n))+'<span class="e">'+esc(f.slice(n))+'</span>';

function renderLessons(){const rows=S.lessons.map(l=>{const on=S.active.includes(l.id),m=l.words.length?Math.round(l.words.reduce((s,w)=>s+(S.box[w.la]||0),0)/(l.words.length*5)*100):0;

function addLib(bi,li){const b=LIB.books[bi],l=b.lessons[li],key=b.name+'|'+l.name,id='l'+Date.now();
  S.lessons.push({id,name:l.name,words:l.words.map(w=>({la:w[0],de:w[1]}))});S.added.push(key);S.active=[id];save();SFX.win();toast(l.name+' hinzugefügt','Wird jetzt geübt');checkAch();renderLessons()}

function delL(id){if(delArm!==id){delArm=id;renderLessons();setTimeout(()=>{if(delArm===id){delArm=null;if(tab==='lessons'&&!mode)renderLessons()}},3000);return}

/* Foto scannen */
async function shrink(file){const img=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
$('photo').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!sampleApi)return;
  view(`<div class="game-top"><button class="x" onclick="go('lessons')">${I('back')}</button><b style="flex:1">Foto wird gelesen</b></div><div class="card center"><div class="spin"></div><div class="small">Claude liest die Vokabeln aus dem Foto …</div></div>`,false);
  try{const blob=await shrink(f);
    const prompt='Auf diesem Foto ist eine Seite aus einem Lateinbuch oder Vokabelheft. Lies alle lateinisch-deutschen Vokabeln ab. Antworte NUR mit JSON in dieser Form: {"name":"Lektionsname falls erkennbar, sonst leer","words":[{"la":"Latein genau wie gedruckt, mit Genitiv/Geschlecht bzw. Stammformen, z. B. servus, servi m.","de":"deutsche Bedeutungen, mit Komma getrennt"}]}. Lass Beispielsätze, Seitenzahlen und Erklärungen weg.';
    let out;try{out=await sampleApi.json(prompt,{images:[blob],modelTier:'default'})}catch(err){if(err&&err.code==='not_granted')throw err;const r=await sampleApi(prompt,{images:[blob]});out=JSON.parse((r.text.match(/\{[\s\S]*\}/)||['{}'])[0])}
    const words=(out&&out.words||[]).filter(w=>w&&w.la&&w.de);if(!words.length)throw new Error('leer');
    editL(null,{name:out.name||'Foto-Lektion',text:words.map(w=>w.la+' = '+w.de).join('\n')});fb('lfb','info',I('check')+'<span>'+words.length+' Vokabeln erkannt. Bitte kurz prüfen und dann speichern.</span>')}
  catch(err){view(`<div class="game-top"><button class="x" onclick="go('lessons')">${I('back')}</button><b style="flex:1">Foto scannen</b></div>
    <div class="fb show err">${I('x')}<span>${err&&err.code==='rate_limited'?'Gerade zu viele Anfragen. Bitte gleich nochmal versuchen.':'Das Foto konnte nicht gelesen werden. Versuch es mit einem schärferen, geraden Foto.'}</span></div>

  ${ach}
  <div class="label">Einstellungen</div><div class="list">
    <div class="item" style="cursor:default"><div class="ic">${I('user')}</div><div class="tx"><b>Dein Name</b><div class="s">so erscheinst du in der Rangliste</div></div><input type="text" value="${esc(S.uname||'')}" placeholder="Vorname" style="width:130px;padding:8px 10px;font-size:15px" onchange="S.uname=this.value.trim().slice(0,20);save()"></div>
    <div class="item" style="cursor:default"><div class="ic">${I('columns')}</div><div class="tx"><b>Deine Klasse</b><div class="s">z. B. 8b</div></div><input type="text" value="${esc(S.klasse||'')}" placeholder="8b" style="width:130px;padding:8px 10px;font-size:15px" onchange="S.klasse=this.value.trim().slice(0,6);save()"></div>
    <div class="item" style="cursor:default"><div class="ic">${I('moon')}</div><div class="tx"><b>Design</b></div><div class="seg">${[['auto','Auto'],['light','Hell'],['dark','Dunkel']].map(([k,n])=>`<button class="${S.theme===k?'on':''}" onclick="S.theme='${k}';save();applyTheme();renderProfile()">${n}</button>`).join('')}</div></div>
    <div class="item" style="cursor:default"><div class="ic">${I('volume')}</div><div class="tx"><b>Töne</b></div><div class="seg"><button class="${S.sound?'on':''}" onclick="S.sound=true;save();renderProfile()">An</button><button class="${S.sound?'':'on'}" onclick="S.sound=false;save();renderProfile()">Aus</button></div></div>
  </div>`)}

/* ================= Tastatur ================= */
document.addEventListener('keydown',e=>{if($('ovl').classList.contains('show')&&(e.key==='Enter'||e.code==='Space')){$('ovl').classList.remove('show');e.preventDefault();return}
  if(mode==='cards'){if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();rate(true)}if(e.key==='Backspace'||e.key==='Delete'||e.key==='ArrowLeft'){e.preventDefault();rate(false)}}
  if(/^[1-4]$/.test(e.key)&&document.activeElement.tagName!=='INPUT'){const b=document.querySelectorAll('.answers .ans')[+e.key-1];if(b)b.click()}});

/* ================= Start ================= */
addEventListener('resize',sizeFx);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
load();applyTheme();sizeFx();checkAch(true);go('learn');
(async()=>{try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d)dlApi=d}}catch(e){}})();
(async()=>{try{if(window.claude&&claude.use){const s=await claude.use('sample');if(s){let ok=true;try{ok=!!(await s.limits()).images}catch(e){}if(ok){sampleApi=s;if(tab==='lessons'&&!mode)renderLessons()}}}}catch(e){}})();

</script>
</body>
</html>
